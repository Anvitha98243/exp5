
name: Crop Recommendation Continuous Delivery

"on":
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  train-test-deliver:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Train crop recommendation model
        run: python train_model.py

      - name: Check ML quality gate
        run: python quality_gate.py

      - name: Run automated ML tests
        run: python -m unittest test_ml_pipeline.py -v

      - name: Run prediction API tests
        run: python -m unittest test_app.py -v

      - name: Prepare release candidate
        run: |
          mkdir -p release_candidate/artifacts
          cp app.py release_candidate/
          cp artifacts/crop_model.joblib release_candidate/artifacts/
          cp metrics.json release_candidate/
          cp requirements.txt release_candidate/
          cp Dockerfile release_candidate/
          cp .dockerignore release_candidate/
          printf "Crop Recommendation API\nRun: python app.py\nEndpoint: POST /predict\n" > release_candidate/DEPLOYMENT.txt

      - name: Upload release candidate
        uses: actions/upload-artifact@v4
        with:
          name: crop-recommendation-ml-release
          path: release_candidate/
          if-no-files-found: error
          retention-days: 7

      - name: Build Docker image
        run: docker build -t crop-recommendation-api:${{ github.sha }} .

      - name: Start Docker container
        run: |
          docker run -d \
            --name crop-api-ci \
            -p 5000:5000 \
            crop-recommendation-api:${{ github.sha }}

      - name: Wait for API health check
        run: |
          for i in $(seq 1 30); do
            if curl --fail --silent http://localhost:5000/health; then
              echo "API health check passed"
              exit 0
            fi
            echo "Waiting for API to start... attempt $i"
            sleep 2
          done
          echo "API failed to become healthy"
          docker logs crop-api-ci
          exit 1

      - name: Test prediction endpoint
        run: |
          response=$(curl --fail --silent --show-error \
            -X POST http://localhost:5000/predict \
            -H "Content-Type: application/json" \
            -d '{"N":90,"P":42,"K":43,"temperature":20.8,"humidity":82,"ph":6.5,"rainfall":202.9}')
          echo "Prediction response: $response"
          echo "$response" | python -c "import json,sys; data=json.load(sys.stdin); assert 'predicted_crop' in data; print('Prediction endpoint test passed')"

      - name: Show container logs on failure
        if: failure()
        run: docker logs crop-api-ci || true

      - name: Clean up Docker container
        if: always()
        run: docker rm -f crop-api-ci || true
